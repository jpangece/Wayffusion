name: mappo_shared_long
algorithm: mappo
policy_class: mappo_shared
cnn_channels: [16, 32, 64]
agent_hidden_dim: 64
joint_hidden_dim: 256
decoder_hidden_dim: 128
num_envs: 8
rollout_steps: 256
total_updates: 1000
epochs: 4
minibatch_size: 512
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.01
vf_coef: 0.5
learning_rate: 0.0002
max_grad_norm: 0.5
reward_norm: true
advantage_norm: true
lr_schedule: linear
eval_interval: 50
target_kl: 0.03
log_std_init: -0.3
log_std_min: -1.5
log_std_max: 0.5
tensorboard_metric_mode: core
