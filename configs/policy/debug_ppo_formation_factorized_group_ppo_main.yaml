name: debug_ppo_formation_factorized_group_ppo_main
algorithm: ppo
policy_class: factorized_group
cnn_channels: [16, 32, 64]
agent_hidden_dim: 96
joint_hidden_dim: 256
decoder_hidden_dim: 128
use_spatial_attention: true
use_spatial_action_head: true
spatial_pool_size: 8
attention_heads: 4
num_groups: 4
group_hidden_dim: 128
group_assignment_temperature: 0.7
group_action_strength: 0.35
use_group_spatial_slots: true
coordination_repulsion_strength: 0.15
spatial_action_strength: 0.25
use_angular_slot_embeddings: true
slot_embedding_strength: 1.0
num_envs: 8
rollout_steps: 256
total_updates: 500
target_episodes: 0
epochs: 2
minibatch_size: 512
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.03
target_kl: 0.0025
ent_coef: 0.001
vf_coef: 0.5
learning_rate: 0.000006
reference_policy_coef: 0.1
max_grad_norm: 0.5
log_std_init: -1.3
log_std_min: -1.6
log_std_max: -0.7
reward_norm: true
advantage_norm: true
lr_schedule: constant
eval_interval: 20
tensorboard_metric_mode: core
