name: direct_connectivity_expansion_specialist
algorithm: mappo_waypoint
policy_class: direct_waypoint
num_envs: 8
rollout_steps: 256
total_updates: 1000
epochs: 4
minibatch_size: 512
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.003
vf_coef: 0.75
learning_rate: 0.0001
max_grad_norm: 0.5
reward_norm: true
advantage_norm: true
lr_schedule: linear
target_kl: 0.02
eval_interval: 50
cnn_channels: [16, 32, 64]
agent_hidden_dim: 64
joint_hidden_dim: 192
attention_heads: 4
use_attention: true
map_size: 1.0
grid_size: 32
max_waypoint_distance: 0.12
max_delta: 0.12
log_std_init: -2.0
log_std_min: -3.0
log_std_max: -0.7
base_position: [0.10, 0.10]
no_fly_zones:
  - center: [0.55, 0.55]
    radius: 0.08
tensorboard_metric_mode: core
use_lagrangian_connectivity_cost: false
connectivity_cost_target: 0.05
lagrangian_lr: 0.01
lambda_cost_init: 1.0
lambda_cost_min: 0.0
lambda_cost_max: 50.0
cost_signal: connectivity_violation_rate
use_connectivity_auxiliary_loss: false
aux_connectivity_coef: 0.05
aux_coverage_coef: 0.02
aux_targets:
  - connectivity_violation
  - coverage_gain
