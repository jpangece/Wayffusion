name: direct_waypoint_uvfa
algorithm: mappo_waypoint
policy_class: direct_waypoint_uvfa
num_envs: 8
rollout_steps: 256
total_updates: 4000
epochs: 4
minibatch_size: 512
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.005
vf_coef: 0.75
learning_rate: 0.0002
max_grad_norm: 0.5
reward_norm: true
reward_norm_scope: task
advantage_norm: true
lr_schedule: linear
target_kl: 0.03
eval_interval: 100
cnn_channels: [16, 32, 64]
agent_hidden_dim: 96
joint_hidden_dim: 256
goal_hidden_dim: 64
goal_embedding_dim: 64
attention_heads: 4
use_attention: true
task_field_channel_mode: task_relevant
use_spatial_field_context: false
use_field_moment_context: true
field_moment_include_inverse: true
max_waypoint_distance: 0.18
max_delta: 0.18
log_std_init: -1.6
log_std_min: -3.0
log_std_max: -0.5
tensorboard_metric_mode: core
connectivity_candidate_filter: false
