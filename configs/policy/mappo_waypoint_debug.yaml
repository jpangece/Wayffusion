name: mappo_waypoint_debug
algorithm: mappo_waypoint
policy_class: direct_waypoint
num_envs: 2
rollout_steps: 32
total_updates: 10
epochs: 2
minibatch_size: 64
gamma: 0.99
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.01
vf_coef: 0.5
learning_rate: 0.0003
max_grad_norm: 0.5
reward_norm: true
advantage_norm: true
lr_schedule: linear
target_kl: 0.05
eval_interval: 5
cnn_channels: [8, 16, 32]
agent_hidden_dim: 32
joint_hidden_dim: 96
attention_heads: 4
use_attention: true
map_size: 1.0
grid_size: 32
max_waypoint_distance: 0.20
max_delta: 0.20
log_std_init: -0.8
log_std_min: -1.8
log_std_max: 0.1
comm_radius: 0.36
base_comm_radius: 0.45
connectivity_candidate_filter: true
base_position: [0.10, 0.10]
no_fly_zones:
  - center: [0.55, 0.55]
    radius: 0.08
tensorboard_metric_mode: core
