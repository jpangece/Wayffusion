seed: 0
map_size: 1.0
physical_scale:
  meters_per_unit: 100.0
world_dim: 2
action_interface: waypoint
action_mode: waypoint
waypoint_dim: 2
min_altitude: null
max_altitude: null
execution_model: mpe_core
grid_size: 32
num_agents: 4
max_steps: 80
dt_decision: 2.0
max_speed: 0.04
max_waypoint_distance: 0.20
min_uav_distance: 0.035
sensor_radius: 0.12
comm_radius: 0.36
base_comm_radius: 0.45
base_position: [0.10, 0.10]
default_altitude: 30.0
strict_action_validation: false
connectivity_candidate_filter: true
render_candidates: true
action_adapter:
  name: waypoint_velocity_tracker
  meters_per_unit: 100.0
  max_command_distance: 0.20
  max_speed: 0.04
  slowdown_radius: 0.08
  velocity_gain: 4.0
  max_accel: 0.10
  control_smoothing: 0.45
  acceptance_radius: 0.020
  hover_when_arrived: true
  command_latency_steps: 0
  tracking_noise_std: 0.0
  clip_to_geofence: true
  reject_no_fly_waypoints: true
dynamics_backend:
  name: mpe_core
  source: third_party_openai_mpe
  dt: 0.1
  substeps: 20
  mass: 1.0
  damping: 0.25
  max_speed: 0.04
  agent_size: 0.02
  agent_accel: 1.0
  action_scale: 1.0
  contact_force: 100.0
  contact_margin: 0.01
  enable_boundary_projection: true
  enable_no_fly_projection: true
task_names:
  - area_coverage
  - belief_search
  - priority_inspection
  - connectivity_expansion
task_sampling_probs:
  area_coverage: 1.0
  belief_search: 1.0
  priority_inspection: 1.0
  connectivity_expansion: 1.0
  dynamic_target_escort: 0.5
  target_interception: 0.5
no_fly_zones:
  - center: [0.55, 0.55]
    radius: 0.08
domain_randomization:
  enabled: true
  base_position:
    enabled: true
    x_range: [0.06, 0.16]
    y_range: [0.06, 0.16]
  spawn:
    min_radius: 0.03
    max_radius: 0.25
    min_separation_scale: 1.8
    max_attempts: 300
  no_fly_zones:
    enabled: true
    include_static: true
    min_count: 0
    max_count: 1
    circle_probability: 0.8
    radius_range: [0.04, 0.07]
    rectangle_size_range: [0.05, 0.10]
    boundary_margin: 0.05
    base_clearance: 0.15
    zone_clearance: 0.04
rendering:
  width: 600
  height: 600
tasks:
  area_coverage:
    success_ratio: 0.85
    w_new: 160.0
    w_overlap: 0.25
    w_distance: 0.2
    w_safety: 2.0
  belief_search:
    num_peaks: 3
    num_peaks_range: [2, 5]
    success_mass: 0.85
    detection_bonus: 8.0
    w_prob: 120.0
    w_repeat: 1.0
    w_distance: 0.15
    w_safety: 2.0
  priority_inspection:
    num_pois: 8
    num_pois_range: [6, 10]
    poi_min_separation: 0.05
    success_weighted_completion: 0.80
    w_visit: 6.0
    w_repeat: 0.4
    w_late: 1.0
    w_distance: 0.15
    w_safety: 2.0
  connectivity_expansion:
    success_coverage: 0.55
    success_radius: 0.45
    max_violation_rate: 0.10
    w_expand: 5.0
    w_coverage: 120.0
    w_relay: 0.5
    w_disconnect: 4.0
    w_distance: 0.15
    w_safety: 2.0
  dynamic_target_escort:
    target_speed: 0.035
    escort_radius: 0.18
    observation_radius: 0.20
    success_target_coverage: 0.70
    w_obs: 2.0
    w_view: 0.5
    w_too_close: 2.0
    w_too_far: 1.0
    w_distance: 0.1
    w_safety: 2.0
  target_interception:
    interception_radius: 0.12
    interception_bonus: 8.0
    w_belief: 2.0
    w_contain: 0.5
    w_distance: 0.1
    w_safety: 2.0
