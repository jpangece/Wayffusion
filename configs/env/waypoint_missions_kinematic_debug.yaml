seed: 0
map_size: 1.0
world_dim: 2
action_interface: waypoint
action_mode: waypoint
waypoint_dim: 2
min_altitude: null
max_altitude: null
execution_model: kinematic_point
grid_size: 32
num_agents: 4
max_steps: 80
dt_decision: 1.0
max_speed: 0.08
max_waypoint_distance: 0.22
min_uav_distance: 0.035
sensor_radius: 0.12
comm_radius: 0.36
base_comm_radius: 0.45
base_position: [0.10, 0.10]
default_altitude: 30.0
strict_action_validation: false
connectivity_candidate_filter: true
render_candidates: true
action_adapter:
  name: waypoint_velocity_tracker
  max_command_distance: 0.22
  max_speed: 0.08
  slowdown_radius: 0.12
  velocity_gain: 4.0
  max_accel: 0.25
  control_smoothing: 0.35
  acceptance_radius: 0.025
  hover_when_arrived: true
  command_latency_steps: 0
  tracking_noise_std: 0.0
  clip_to_geofence: true
  reject_no_fly_waypoints: true
dynamics_backend:
  name: kinematic_point
  decision_dt: 1.0
  max_speed: 0.08
task_names:
  - area_coverage
  - belief_search
  - priority_inspection
  - connectivity_expansion
task_sampling_probs:
  area_coverage: 1.0
  belief_search: 1.0
  priority_inspection: 1.0
  connectivity_expansion: 1.0
  dynamic_target_escort: 0.5
  target_interception: 0.5
no_fly_zones:
  - center: [0.55, 0.55]
    radius: 0.08
rendering:
  width: 600
  height: 600
tasks:
  area_coverage:
    success_ratio: 0.55
    w_new: 160.0
    w_overlap: 0.25
    w_distance: 0.2
    w_safety: 2.0
  belief_search:
    num_peaks: 3
    success_mass: 0.55
    detection_bonus: 8.0
    w_prob: 120.0
    w_repeat: 1.0
    w_distance: 0.15
    w_safety: 2.0
  priority_inspection:
    num_pois: 8
    success_weighted_completion: 0.70
    w_visit: 6.0
    w_repeat: 0.4
    w_late: 1.0
    w_distance: 0.15
    w_safety: 2.0
  connectivity_expansion:
    success_coverage: 0.35
    success_radius: 0.45
    max_violation_rate: 0.10
    w_expand: 5.0
    w_coverage: 120.0
    w_relay: 0.5
    w_disconnect: 4.0
    w_distance: 0.15
    w_safety: 2.0
  dynamic_target_escort:
    target_speed: 0.035
    escort_radius: 0.18
    observation_radius: 0.20
    success_target_coverage: 0.70
    w_obs: 2.0
    w_view: 0.5
    w_too_close: 2.0
    w_too_far: 1.0
    w_distance: 0.1
    w_safety: 2.0
  target_interception:
    interception_radius: 0.12
    interception_bonus: 8.0
    w_belief: 2.0
    w_contain: 0.5
    w_distance: 0.1
    w_safety: 2.0
